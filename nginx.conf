server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Résolution DNS de Docker : permet de démarrer même si le backend n'est pas encore prêt
    # et de suivre les changements d'instances pendant une mise à jour sans coupure.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Contrôle de santé du frontend (utilisé par Docker et Jenkins)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Le navigateur appelle /api/..., Nginx transmet au backend FastAPI sans le préfixe /api.
    # Le nom "backend" et le port 8000 sont à confirmer avec le docker-compose du dépôt deployment-cd.
    location /api/ {
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
