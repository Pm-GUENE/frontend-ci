# Limites de débit par adresse IP. Ce fichier est inclus dans le bloc http de Nginx.
#   api       : toutes les routes /api/, pour protéger le backend d'un flot de requêtes ;
#   connexion : plus stricte, contre les essais répétés de mots de passe.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

# La clé est vide pour toutes les routes sauf /api/connexion : une clé vide n'est pas limitée.
map $request_uri $cle_connexion {
    default             "";
    ~^/api/connexion    $binary_remote_addr;
}
limit_req_zone $cle_connexion zone=connexion:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    # Ne pas annoncer la version de Nginx (en-tête Server et pages d'erreur).
    server_tokens off;

    # Les requêtes de l'application sont de petits JSON : on refuse les envois volumineux.
    client_max_body_size 64k;

    root /usr/share/nginx/html;
    index index.html;

    # Résolution DNS de Docker : permet de démarrer même si le backend n'est pas encore prêt
    # et de suivre les changements d'instances pendant une mise à jour sans coupure.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité, valables pour toutes les réponses.
    # Attention : un add_header placé dans un bloc location remplacerait toute cette liste
    # pour ce bloc. Aucun bloc location ci-dessous n'en contient, volontairement.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Le site n'a ni script ni style en ligne : seuls les fichiers du site lui-même sont autorisés.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Contrôle de santé du frontend (utilisé par Docker et Jenkins)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Le navigateur appelle /api/..., Nginx transmet au backend FastAPI sans le préfixe /api.
    # Le service s'appelle "backend" et écoute sur le port 8000 dans le docker-compose de deployment-cd.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req zone=connexion burst=10 nodelay;
        limit_req_status 429;

        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Scripts et feuilles de style : leurs noms ne changent pas d'une version à l'autre.
    # « expires -1 » envoie Cache-Control: no-cache : le navigateur revalide à chaque visite
    # (réponse 304 si rien n'a changé) et reçoit donc le nouveau code dès un redéploiement.
    location ~* \.(css|js)$ {
        expires -1;
        try_files $uri =404;
    }

    # Images : elles changent rarement, le navigateur peut les garder une semaine.
    location ~* \.(png|jpg|jpeg|svg|webp|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Pages HTML : revalidées à chaque visite, comme les scripts.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
