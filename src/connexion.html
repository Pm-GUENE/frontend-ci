<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion | DentaRDV</title>
  <meta name="description" content="Espace réservé aux dentistes et à l'administrateur de la clinique.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-carte">

  <header class="entete-page">
    <nav class="topbar" aria-label="Navigation principale">
      <a class="brand" href="index.html">DentaRDV</a>
      <div class="topbar-links">
        <a class="pill pill-light" href="index.html#dentistes">Prendre rendez-vous</a>
        <a class="pill pill-light" href="suivi.html">Suivre mon rendez-vous</a>
      </div>
    </nav>
  </header>

  <main class="page-principale">
    <div class="carte-contenu">

      <div class="carte-page">
        <h1 class="titre-page">Connexion</h1>

        <p class="notice-page" id="notice" role="status" hidden></p>

        <!-- Affiché à la place du formulaire quand une session est déjà ouverte dans cet onglet -->
        <div id="deja-connecte" hidden>
          <p class="intro-page" id="texte-deja-connecte"></p>
          <div class="actions-suivi">
            <a class="pill pill-dark bouton-action" id="continuer" href="connexion.html">Continuer</a>
            <button type="button" class="pill pill-light bouton-action bouton-contour" id="changer-compte">Se déconnecter</button>
          </div>
        </div>

        <form id="formulaire-connexion" novalidate>
          <div class="champ">
            <label for="champ-identifiant">Identifiant</label>
            <input type="text" id="champ-identifiant" name="identifiant" autocomplete="username"
                   autocapitalize="none" spellcheck="false" required aria-describedby="erreur-identifiant">
            <p class="erreur-champ" id="erreur-identifiant" role="alert"></p>
          </div>

          <div class="champ">
            <label for="champ-mdp">Mot de passe</label>
            <div class="champ-mdp">
              <input type="password" id="champ-mdp" name="mot_de_passe" autocomplete="current-password"
                     required aria-describedby="erreur-mdp">
              <button type="button" class="afficher-mdp" id="afficher-mdp"></button>
            </div>
            <p class="erreur-champ" id="erreur-mdp" role="alert"></p>
          </div>

          <p class="erreur-formulaire" id="erreur-connexion" role="alert"></p>

          <button type="submit" class="pill pill-dark bouton-fenetre" id="bouton-connexion">
            <span id="texte-connexion">Se connecter</span>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>

        <p class="aide-page">Mot de passe oublié ? Contactez l'administrateur de la clinique.</p>
        <p class="aide-page"><a href="index.html">Retour à l'accueil</a></p>
      </div>

      <img class="illustration-page illustration-compte" src="assets/illustration-compte.png" width="429" height="420" alt="">
    </div>
  </main>

  <script src="js/validation.js" defer></script>
  <script src="js/session.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/afficher-mdp.js" defer></script>
  <script src="js/connexion.js" defer></script>
</body>
</html>
