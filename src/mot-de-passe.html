<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Changer votre mot de passe | DentaRDV</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-carte">

  <header class="entete-page">
    <nav class="topbar" aria-label="Navigation principale">
      <a class="brand" href="index.html">DentaRDV</a>
      <div class="topbar-links">
        <button type="button" class="pill pill-light" id="deconnexion">Se déconnecter</button>
      </div>
    </nav>
  </header>

  <main class="page-principale">
    <div class="carte-contenu">

      <div class="carte-page">
        <h1 class="titre-page">Changer votre mot de passe</h1>

        <p class="intro-page" id="intro-mdp">
          Pour votre sécurité, choisissez un nouveau mot de passe avant de continuer.
        </p>

        <form id="formulaire-mdp" novalidate>
          <div class="champ">
            <label for="champ-nouveau">Nouveau mot de passe</label>
            <div class="champ-mdp">
              <input type="password" id="champ-nouveau" name="nouveau" autocomplete="new-password"
                     required aria-describedby="aide-nouveau erreur-nouveau">
              <button type="button" class="afficher-mdp" id="afficher-nouveau"></button>
            </div>
            <p class="aide-champ" id="aide-nouveau">8 caractères au minimum.</p>
            <p class="erreur-champ" id="erreur-nouveau" role="alert"></p>
          </div>

          <div class="champ">
            <label for="champ-confirmation">Confirmer le mot de passe</label>
            <div class="champ-mdp">
              <input type="password" id="champ-confirmation" name="confirmation" autocomplete="new-password"
                     required aria-describedby="erreur-confirmation">
              <button type="button" class="afficher-mdp" id="afficher-confirmation"></button>
            </div>
            <p class="erreur-champ" id="erreur-confirmation" role="alert"></p>
          </div>

          <p class="erreur-formulaire" id="erreur-mdp" role="alert"></p>

          <button type="submit" class="pill pill-dark bouton-fenetre" id="bouton-enregistrer">
            <span id="texte-enregistrer">Enregistrer et continuer</span>
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
              <path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </div>

      <img class="illustration-page illustration-compte" src="assets/illustration-compte.png" width="429" height="420" alt="">
    </div>
  </main>

  <script src="js/validation.js" defer></script>
  <script src="js/session.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/afficher-mdp.js" defer></script>
  <script src="js/mot-de-passe.js" defer></script>
</body>
</html>
