<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DentaRDV | Prise de rendez-vous dentaire</title>
  <meta name="description" content="Réservez en ligne un créneau chez le dentiste de votre choix, sans file d'attente.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="hero">
    <nav class="topbar" aria-label="Navigation principale">
      <a class="brand" href="index.html">DentaRDV</a>
      <div class="topbar-links">
        <a class="pill pill-light" href="suivi.html">Suivre mon rendez-vous</a>
        <a class="pill pill-light" href="connexion.html">Espace professionnel</a>
      </div>
    </nav>

    <div class="hero-content">
      <div class="hero-text">
        <p class="tagline">
          <svg class="tooth" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M7.5 3C5 3 3 5 3 8c0 2 .8 3.5 1.4 5.2.6 1.9.6 4.3 1.3 6.4.4 1.2 1.1 1.9 2 1.9 1.2 0 1.6-1 2-2.6.3-1.2.6-2.6 2.3-2.6s2 1.4 2.300 2.600c.4 1.600.8 2.600 2 2.600.9 0 1.600-.7 2-1.900.7-2.100.7-4.500 1.300-6.400C20.200 11.500 21 10 21 8c0-3-2-5-4.500-5-1.700 0-2.600.7-4.500.7S9.200 3 7.500 3z"
                  fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
          Redonnez vie à votre sourire.
        </p>
        <h1>Prendre soin de vos dents, <strong>sans stress.</strong></h1>
        <a class="pill pill-dark" href="#dentistes">Prendre rendez-vous</a>
      </div>

      <img class="hero-image" src="assets/hero.png" width="482" height="419"
           alt="Un dentiste examine un patient installé sur le fauteuil">
    </div>
  </header>

  <main>
    <section id="dentistes" class="dentistes" aria-labelledby="titre-dentistes">
      <h2 id="titre-dentistes" class="visuellement-cache">Dentistes et créneaux disponibles</h2>

      <form class="recherche" id="formulaire-recherche" role="search">
        <input type="search" id="recherche" name="recherche" autocomplete="off"
               placeholder="dentiste, motif de consultation…"
               aria-label="Rechercher un dentiste ou un motif de consultation">
        <button type="submit" aria-label="Lancer la recherche">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <circle cx="10.500" cy="10.500" r="6.500" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M15.500 15.500L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </form>

      <p id="etat-liste" class="etat-liste" role="status" aria-live="polite"></p>

      <div id="liste-dentistes" class="liste-dentistes"></div>
    </section>
  </main>

  <script src="js/creneaux.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/accueil.js" defer></script>

</body>
</html>
